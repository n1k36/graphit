# render.com blueprint  —  https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tell
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # SQLite is single-writer, so never run more than one instance.
    numInstances: 1
    disk:
      name: tell-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 4173
      - key: PROGNOSE_DB
        value: /app/data/prognose.db
      - key: PUBLIC_BASE_URL
        sync: false      # set to your real https origin
      - key: PAYMENTS_PROVIDER
        value: mock
      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true
